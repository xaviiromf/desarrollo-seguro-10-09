sonar.projectKey=desarrollo-seguro-django
sonar.projectName=Desarrollo Seguro Django
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Exclusiones técnicas: entornos virtuales, dependencias, cachés, archivos generados y carpeta de entrega (no es código de la app).
sonar.exclusions=**/.venv/**,**/venv/**,**/env/**,**/node_modules/**,**/__pycache__/**,**/.scannerwork/**,**/.pytest_cache/**,**/.mypy_cache/**,**/staticfiles/**,**/media/**,evaluacion_u2/**,htmlcov/**
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.py,**/test_*.py
sonar.test.exclusions=**/.venv/**,**/venv/**,**/env/**,**/node_modules/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
