sonar.projectKey=desarrollo-seguro-django
sonar.projectName=Desarrollo Seguro Django
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Exclusiones técnicas: entornos virtuales, dependencias, cachés, archivos generados y carpetas de entrega (evaluaciones: informes, evidencia y herramientas; no son código de la app).
sonar.exclusions=**/.venv/**,**/venv/**,**/env/**,**/node_modules/**,**/__pycache__/**,**/.scannerwork/**,**/.pytest_cache/**,**/.mypy_cache/**,**/staticfiles/**,**/media/**,evaluacion_u2/**,evaluacion_u3/**,htmlcov/**
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.py,**/test_*.py
sonar.test.exclusions=**/.venv/**,**/venv/**,**/env/**,**/node_modules/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Exclusiones SOLO de cobertura (los archivos siguen analizados y sus hallazgos se reportan):
# - migraciones: código generado por Django; init_data.py: script de datos semilla, fuera de la app y de la imagen.
# - JavaScript: no hay framework de pruebas JS que genere el reporte lcov; se verificó en navegador (0 errores, 0 violaciones CSP).
sonar.coverage.exclusions=**/migrations/**,init_data.py,static/**/*.js
