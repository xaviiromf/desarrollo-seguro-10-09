{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Crear Cuenta - PastelMarket{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-12">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="text-center mb-6">
            <span class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-100 text-3xl mb-3">
                ✨
            </span>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Crear Cuenta</h1>
            <p class="text-sm text-slate-500 mt-1">Organiza tus compras de supermercado por prioridad.</p>
        </div>

        <form method="post" novalidate class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm transition">
                Completar Registro
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-500">
            ¿Ya tienes cuenta? 
            <a href="{% url 'login' %}" class="font-semibold text-emerald-600 hover:text-emerald-700">Inicia sesión aquí</a>
        </div>
    </div>
</div>
{% endblock %}
