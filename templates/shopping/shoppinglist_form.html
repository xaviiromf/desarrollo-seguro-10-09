{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ action_title }} - PastelMarket{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-6 sm:my-10">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="mb-6">
            <a href="{% url 'shopping:list_index' %}" class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 hover:text-slate-800 mb-3">
                &larr; Volver
            </a>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
                {{ action_title }}
            </h1>
            <p class="text-xs text-slate-500 mt-1">
                Define el nombre y la prioridad para organizar tus compras.
            </p>
        </div>

        <form method="post" novalidate class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="flex items-center gap-3 pt-4">
                <button type="submit" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm transition">
                    {{ button_label }}
                </button>
                <a href="{% url 'shopping:list_index' %}" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
